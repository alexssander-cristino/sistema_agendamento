<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tratamento de Dados | Orvix</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

  <style>

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --border: #e5e7eb;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .header-content {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;

      min-height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--primary);
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
    }

    .back {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    .back:hover {
      color: var(--primary);
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 32px auto 60px;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
    }

    .actions {
      margin-top: 18px;

      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;

      padding: 10px 16px;
      border-radius: 9px;

      font-weight: 700;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #eef2f7;
      color: var(--text);

      padding: 10px 16px;
      border-radius: 9px;

      font-weight: 600;
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);

      padding: 8px 12px;
      border-radius: 8px;

      font-weight: 700;
    }

    .btn-edit {
      background: #eff6ff;
      color: var(--primary);

      padding: 8px 12px;
      border-radius: 8px;

      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f9fafb;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    td {
      font-size: 14px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .status {
      display: inline-block;

      padding: 4px 9px;
      border-radius: 999px;

      font-size: 12px;
      font-weight: 700;
    }

    .status.ativo {
      background: #dcfce7;
      color: var(--success);
    }

    .status.inativo {
      background: #f3f4f6;
      color: var(--muted);
    }

    .actions-cell {
      white-space: nowrap;
    }

    .actions-cell button {
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
    }

    .loading {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;

      background: rgba(15, 23, 42, .55);

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: min(800px, 100%);
      max-height: 90vh;

      overflow-y: auto;

      background: #fff;
      border-radius: 16px;

      padding: 26px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 22px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 21px;
    }

    .close {
      width: 36px;
      height: 36px;

      border-radius: 8px;

      background: #f3f4f6;
      color: #374151;

      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;

      border: 1px solid #d1d5db;
      border-radius: 9px;

      padding: 10px 12px;

      font: inherit;
      color: var(--text);

      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .checkbox-field input {
      width: auto;
    }

    .modal-footer {
      margin-top: 22px;

      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .message {
      position: fixed;
      right: 20px;
      bottom: 20px;

      max-width: 360px;

      padding: 13px 16px;

      border-radius: 10px;

      color: #fff;

      display: none;

      z-index: 200;

      box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
    }

    .message.success {
      display: block;
      background: var(--success);
    }

    .message.error {
      display: block;
      background: var(--danger);
    }

    @media (max-width: 700px) {

      .header-content {
        min-height: 64px;
      }

      main {
        width: min(100% - 20px, 1200px);
        margin-top: 22px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .modal-content {
        padding: 20px;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="header-content">

    <a
      href="/"
      class="logo"
    >
      Orvix
    </a>

    <a
      href="/"
      class="back"
    >
      Voltar
    </a>

  </div>

</header>


<main>

  <div class="page-header">

    <h1>
      Registro das Operações de Tratamento
    </h1>

    <p>
      Controle interno das atividades de tratamento
      de dados pessoais realizadas pelo Orvix.
    </p>

    <div class="actions">

      <button
        class="btn-primary"
        type="button"
        onclick="abrirNovo()"
      >
        Novo tratamento
      </button>

      <button
        class="btn-secondary"
        type="button"
        onclick="carregar()"
      >
        Atualizar
      </button>

    </div>

  </div>


  <div class="card">

    <div
      id="loading"
      class="loading"
    >
      Carregando registros...
    </div>

    <div
      id="empty"
      class="empty"
      style="display:none;"
    >
      Nenhum registro cadastrado.
    </div>

    <div
      id="table-wrapper"
      class="table-wrapper"
      style="display:none;"
    >

      <table>

        <thead>

          <tr>

            <th>Processo</th>

            <th>Finalidade</th>

            <th>Hipótese legal</th>

            <th>Dados pessoais</th>

            <th>Armazenamento</th>

            <th>Status</th>

            <th>Ações</th>

          </tr>

        </thead>

        <tbody id="lista"></tbody>

      </table>

    </div>

  </div>

</main>


<div
  id="modal"
  class="modal"
>

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="modal-title">
        Novo tratamento
      </h2>

      <button
        class="close"
        type="button"
        onclick="fecharModal()"
      >
        ×
      </button>

    </div>


    <form id="form">

      <input
        type="hidden"
        id="registro-id"
      >


      <div class="form-grid">

        <div class="field full">

          <label for="processo">
            Processo / atividade
          </label>

          <input
            id="processo"
            type="text"
            maxlength="150"
            placeholder="Ex.: Cadastro de usuários"
            required
          >

        </div>


        <div class="field full">

          <label for="finalidade">
            Finalidade
          </label>

          <textarea
            id="finalidade"
            placeholder="Descreva por que os dados são tratados."
            required
          ></textarea>

        </div>


        <div class="field">

          <label for="hipotese-legal">
            Hipótese legal
          </label>

          <input
            id="hipotese-legal"
            type="text"
            placeholder="Ex.: Execução de contrato"
            required
          >

        </div>


        <div class="field">

          <label for="categorias-titulares">
            Categorias de titulares
          </label>

          <input
            id="categorias-titulares"
            type="text"
            placeholder="Ex.: Usuários e clientes"
          >

        </div>


        <div class="field full">

          <label for="dados-pessoais">
            Dados pessoais tratados
          </label>

          <textarea
            id="dados-pessoais"
            placeholder="Ex.: Nome, e-mail, telefone..."
            required
          ></textarea>

        </div>


        <div class="field full">

          <label for="compartilhamento">
            Compartilhamento
          </label>

          <textarea
            id="compartilhamento"
            placeholder="Descreva com quem ou quais tipos de fornecedores os dados podem ser compartilhados."
          ></textarea>

        </div>


        <div class="field">

          <label for="periodo">
            Período de armazenamento
          </label>

          <input
            id="periodo"
            type="text"
            placeholder="Ex.: Enquanto a conta estiver ativa"
          >

        </div>


        <div class="field">

          <label for="seguranca">
            Medidas de segurança
          </label>

          <textarea
            id="seguranca"
            placeholder="Ex.: HTTPS, autenticação, controle de acesso..."
          ></textarea>

        </div>


        <div class="field full">

          <label for="observacoes">
            Observações
          </label>

          <textarea
            id="observacoes"
            placeholder="Informações adicionais."
          ></textarea>

        </div>


        <div class="field full">

          <label class="checkbox-field">

            <input
              id="ativo"
              type="checkbox"
              checked
            >

            Registro ativo

          </label>

        </div>

      </div>


      <div class="modal-footer">

        <button
          type="button"
          class="btn-secondary"
          onclick="fecharModal()"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-primary"
        >
          Salvar
        </button>

      </div>

    </form>

  </div>

</div>


<div
  id="message"
  class="message"
></div>


<script>

  const API = '/api';

  const token =
    localStorage.getItem('lavajato_auth_token');


  let registros = [];


  // ==========================================================
  // MENSAGEM
  // ==========================================================

  function mostrarMensagem(texto, tipo = 'success') {

    const elemento =
      document.getElementById('message');

    elemento.textContent = texto;

    elemento.className =
      `message ${tipo}`;

    setTimeout(() => {

      elemento.className = 'message';

    }, 3500);
  }


  // ==========================================================
  // REQUISIÇÃO
  // ==========================================================

  async function requisicao(url, opcoes = {}) {

    const headers = {
      ...(opcoes.headers || {}),
      Authorization: `Bearer ${token}`
    };

    if (
      opcoes.body &&
      typeof opcoes.body !== 'string'
    ) {
      headers['Content-Type'] =
        'application/json';

      opcoes.body =
        JSON.stringify(opcoes.body);
    }

    const resposta =
      await fetch(url, {
        ...opcoes,
        headers
      });


    if (
      resposta.status === 401 ||
      resposta.status === 403
    ) {

      window.location.href =
        '/login.html';

      throw new Error(
        'Acesso não autorizado.'
      );

    }


    const texto =
      await resposta.text();

    let dados = null;

    try {
      dados = texto
        ? JSON.parse(texto)
        : null;
    } catch {
      dados = null;
    }


    if (!resposta.ok) {

      throw new Error(
        dados?.erro ||
        'Não foi possível realizar a operação.'
      );

    }


    return dados;

  }


  // ==========================================================
  // VERIFICAR DEV
  // ==========================================================

  async function verificarDev() {

    if (!token) {

      window.location.href =
        '/login.html';

      return false;

    }


    try {

      const resposta =
        await fetch(
          `${API}/auth/me`,
          {
            headers: {
              Authorization:
                `Bearer ${token}`
            }
          }
        );


      if (!resposta.ok) {

        localStorage.removeItem(
          'lavajato_auth_token'
        );

        window.location.href =
          '/login.html';

        return false;

      }


      const dados =
        await resposta.json();


      if (
        !dados.usuario ||
        dados.usuario.perfil !== 'dev'
      ) {

        alert(
          'Acesso permitido somente ao DEV.'
        );

        window.location.href =
          '/dashboard.html';

        return false;

      }


      return true;

    } catch (err) {

      console.error(
        'Erro ao verificar usuário:',
        err
      );

      window.location.href =
        '/login.html';

      return false;

    }

  }


  // ==========================================================
  // CARREGAR
  // ==========================================================

  async function carregar() {

    const loading =
      document.getElementById('loading');

    const empty =
      document.getElementById('empty');

    const wrapper =
      document.getElementById('table-wrapper');

    loading.style.display = 'block';
    empty.style.display = 'none';
    wrapper.style.display = 'none';


    try {

      registros =
        await requisicao(
          `${API}/admin/tratamentos`
        );


      renderizar();

    } catch (err) {

      console.error(err);

      mostrarMensagem(
        err.message,
        'error'
      );

    } finally {

      loading.style.display = 'none';

    }

  }


  // ==========================================================
  // RENDERIZAR
  // ==========================================================

  function renderizar() {

    const lista =
      document.getElementById('lista');

    const empty =
      document.getElementById('empty');

    const wrapper =
      document.getElementById('table-wrapper');


    lista.innerHTML = '';


    if (!registros.length) {

      empty.style.display = 'block';

      wrapper.style.display = 'none';

      return;

    }


    empty.style.display = 'none';

    wrapper.style.display = 'block';


    registros.forEach(registro => {

      const tr =
        document.createElement('tr');


      tr.innerHTML = `

        <td>
          <strong>
            ${escapar(registro.processo)}
          </strong>
        </td>

        <td>
          ${escapar(registro.finalidade)}
        </td>

        <td>
          ${escapar(registro.hipotese_legal)}
        </td>

        <td>
          ${escapar(registro.dados_pessoais)}
        </td>

        <td>
          ${escapar(
            registro.periodo_armazenamento ||
            '-'
          )}
        </td>

        <td>

          <span
            class="status ${
              registro.ativo
                ? 'ativo'
                : 'inativo'
            }"
          >
            ${
              registro.ativo
                ? 'Ativo'
                : 'Inativo'
            }
          </span>

        </td>

        <td class="actions-cell">

          <button
            class="btn-edit"
            type="button"
            onclick="editar(${registro.id})"
          >
            Editar
          </button>

          <button
            class="btn-danger"
            type="button"
            onclick="excluir(${registro.id})"
          >
            Excluir
          </button>

        </td>

      `;


      lista.appendChild(tr);

    });

  }


  // ==========================================================
  // ESCAPAR HTML
  // ==========================================================

  function escapar(valor) {

    if (
      valor === null ||
      valor === undefined
    ) {
      return '';
    }


    return String(valor)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

  }


  // ==========================================================
  // NOVO
  // ==========================================================

  function abrirNovo() {

    document.getElementById(
      'modal-title'
    ).textContent =
      'Novo tratamento';


    document.getElementById(
      'form'
    ).reset();


    document.getElementById(
      'registro-id'
    ).value = '';


    document.getElementById(
      'ativo'
    ).checked = true;


    document.getElementById(
      'modal'
    ).classList.add('active');

  }


  // ==========================================================
  // EDITAR
  // ==========================================================

  async function editar(id) {

    try {

      const registro =
        await requisicao(
          `${API}/admin/tratamentos/${id}`
        );


      document.getElementById(
        'modal-title'
      ).textContent =
        'Editar tratamento';


      document.getElementById(
        'registro-id'
      ).value =
        registro.id;


      document.getElementById(
        'processo'
      ).value =
        registro.processo || '';


      document.getElementById(
        'finalidade'
      ).value =
        registro.finalidade || '';


      document.getElementById(
        'hipotese-legal'
      ).value =
        registro.hipotese_legal || '';


      document.getElementById(
        'dados-pessoais'
      ).value =
        registro.dados_pessoais || '';


      document.getElementById(
        'categorias-titulares'
      ).value =
        registro.categorias_titulares || '';


      document.getElementById(
        'compartilhamento'
      ).value =
        registro.compartilhamento || '';


      document.getElementById(
        'periodo'
      ).value =
        registro.periodo_armazenamento || '';


      document.getElementById(
        'seguranca'
      ).value =
        registro.medidas_seguranca || '';


      document.getElementById(
        'observacoes'
      ).value =
        registro.observacoes || '';


      document.getElementById(
        'ativo'
      ).checked =
        registro.ativo;


      document.getElementById(
        'modal'
      ).classList.add('active');

    } catch (err) {

      mostrarMensagem(
        err.message,
        'error'
      );

    }

  }


  // ==========================================================
  // SALVAR
  // ==========================================================

  document
    .getElementById('form')
    .addEventListener(
      'submit',
      async event => {

        event.preventDefault();


        const id =
          document.getElementById(
            'registro-id'
          ).value;


        const dados = {

          processo:
            document.getElementById(
              'processo'
            ).value,

          finalidade:
            document.getElementById(
              'finalidade'
            ).value,

          hipotese_legal:
            document.getElementById(
              'hipotese-legal'
            ).value,

          dados_pessoais:
            document.getElementById(
              'dados-pessoais'
            ).value,

          categorias_titulares:
            document.getElementById(
              'categorias-titulares'
            ).value,

          compartilhamento:
            document.getElementById(
              'compartilhamento'
            ).value,

          periodo_armazenamento:
            document.getElementById(
              'periodo'
            ).value,

          medidas_seguranca:
            document.getElementById(
              'seguranca'
            ).value,

          observacoes:
            document.getElementById(
              'observacoes'
            ).value,

          ativo:
            document.getElementById(
              'ativo'
            ).checked

        };


        try {

          if (id) {

            await requisicao(
              `${API}/admin/tratamentos/${id}`,
              {
                method: 'PATCH',
                body: dados
              }
            );


            mostrarMensagem(
              'Registro atualizado com sucesso.'
            );

          } else {

            await requisicao(
              `${API}/admin/tratamentos`,
              {
                method: 'POST',
                body: dados
              }
            );


            mostrarMensagem(
              'Registro criado com sucesso.'
            );

          }


          fecharModal();

          await carregar();

        } catch (err) {

          mostrarMensagem(
            err.message,
            'error'
          );

        }

      }
    );


  // ==========================================================
  // EXCLUIR
  // ==========================================================

  async function excluir(id) {

    const confirmar =
      confirm(
        'Tem certeza que deseja excluir este registro?'
      );


    if (!confirmar) {
      return;
    }


    try {

      await requisicao(
        `${API}/admin/tratamentos/${id}`,
        {
          method: 'DELETE'
        }
      );


      mostrarMensagem(
        'Registro excluído com sucesso.'
      );


      await carregar();

    } catch (err) {

      mostrarMensagem(
        err.message,
        'error'
      );

    }

  }


  // ==========================================================
  // MODAL
  // ==========================================================

  function fecharModal() {

    document.getElementById(
      'modal'
    ).classList.remove('active');

  }


  document
    .getElementById('modal')
    .addEventListener(
      'click',
      event => {

        if (
          event.target.id === 'modal'
        ) {
          fecharModal();
        }

      }
    );


  // ==========================================================
  // INICIALIZAÇÃO
  // ==========================================================

  (async function iniciar() {

    const autorizado =
      await verificarDev();


    if (!autorizado) {
      return;
    }


    await carregar();

  })();

</script>

</body>

</html>
