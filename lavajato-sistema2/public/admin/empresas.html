<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Empresas | Orvix</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

  <link
    rel="stylesheet"
    href="/css/dev.css"
  >
</head>

<body>

<div class="layout">

  <aside class="sidebar">

    <div class="logo">
      Or<span>vix</span>
    </div>

    <div class="menu">

      <div class="menu-title">Geral</div>

      <a href="/admin/dashboard.html">
        Dashboard
      </a>

      <a href="/admin/planos.html">
        Planos
      </a>

      <div class="menu-title">SaaS</div>

      <a href="/admin/empresas.html" class="active">
        Empresas
      </a>

      <a href="/admin/assinaturas.html">
        Assinaturas
      </a>

      <a href="/admin/pagamentos.html">
        Pagamentos
      </a>

      <a href="/admin/usuarios.html">
        Usuários
      </a>

      <div class="menu-title">Sistema</div>

      <a href="/">
        Abrir sistema
      </a>

    </div>

    <button class="logout" onclick="logout()">
      Sair
    </button>

  </aside>

  <main class="main">

    <div class="topbar">

      <div>
        <h1>Empresas</h1>
        <p class="subtitle">
          Empresas cadastradas no sistema SaaS.
        </p>
      </div>

      <button class="btn btn-primary" onclick="novaEmpresa()">
        + Nova empresa
      </button>

    </div>

    <div class="filters">

      <input
        type="text"
        class="input"
        id="busca"
        placeholder="Pesquisar empresa..."
      >

      <select class="select" id="status">
        <option value="">Todos os status</option>
        <option value="ativa">Ativas</option>
        <option value="pendente">Pendentes</option>
        <option value="inativa">Inativas</option>
      </select>

      <button class="btn btn-primary" onclick="filtrar()">
        Filtrar
      </button>

    </div>

    <div class="table-card">

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>Empresa</th>
              <th>Administrador</th>
              <th>E-mail</th>
              <th>Plano</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="empresasTabela">

            <tr>
              <td>
                Orvix Exemplo
              </td>

              <td>
                João da Silva
              </td>

              <td>
                joao@email.com
              </td>

              <td>
                Plano Mensal
              </td>

              <td>
                <span class="status active">
                  Ativa
                </span>
              </td>

              <td>
                <div class="actions">
                  <button
                    class="action"
                    onclick="detalhesEmpresa(1)"
                  >
                    Detalhes
                  </button>

                  <button
                    class="action"
                    onclick="testarEmpresa(1)"
                  >
                    Entrar como teste
                  </button>
                </div>
              </td>

            </tr>

            <tr id="emptyRow" style="display:none;">
              <td colspan="6">
                <div class="empty">
                  Nenhuma empresa encontrada.
                </div>
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>

</div>

<script src="/admin/js/empresas.js"></script>

</body>
</html>
