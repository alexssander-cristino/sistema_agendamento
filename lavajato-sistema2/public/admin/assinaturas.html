<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Assinaturas | Lavajato</title>

  <style>

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #15803d;
      --success-bg: #dcfce7;
      --warning: #b45309;
      --warning-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --info: #0369a1;
      --info-bg: #e0f2fe;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      padding: 28px 20px;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-weight: 700;
      background: #fff;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      border-color: var(--border);
      color: var(--text);
    }

    .btn-danger {
      background: var(--danger-bg);
      border-color: #fecaca;
      color: #991b1b;
    }

    .btn-warning {
      background: var(--warning-bg);
      border-color: #fde68a;
      color: #92400e;
    }

    .btn-success {
      background: var(--success-bg);
      border-color: #bbf7d0;
      color: #166534;
    }

    .btn-info {
      background: var(--info-bg);
      border-color: #bae6fd;
      color: #075985;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px auto;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .field {
      min-height: 44px;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #fff;
      outline: none;
    }

    .field:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 3px rgba(37, 99, 235, .12);
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    th,
    td {
      padding: 15px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      background: #fafafa;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    td {
      font-size: 14px;
    }

    tbody tr:hover {
      background: #fafcff;
    }

    .company-name {
      font-weight: 700;
    }

    .company-id {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .plan-name {
      font-weight: 700;
    }

    .plan-price {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-ativa {
      color: #166534;
      background: var(--success-bg);
    }

    .status-pendente {
      color: #92400e;
      background: var(--warning-bg);
    }

    .status-pausada {
      color: #075985;
      background: var(--info-bg);
    }

    .status-inadimplente,
    .status-cancelada {
      color: #991b1b;
      background: var(--danger-bg);
    }

    .status-default {
      color: #374151;
      background: #f3f4f6;
    }

    .mp-id {
      max-width: 170px;
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
    }

    .actions-cell {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      min-width: 220px;
    }

    .action-btn {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .action-btn:hover {
      background: #f9fafb;
    }

    .empty {
      padding: 55px 20px;
      text-align: center;
      color: var(--muted);
    }

    .loading {
      padding: 55px 20px;
      text-align: center;
      color: var(--muted);
    }

    .alert {
      display: none;
      margin-bottom: 18px;
      padding: 13px 15px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      color: #991b1b;
      background: var(--danger-bg);
      border: 1px solid #fecaca;
    }

    .alert-success {
      color: #166534;
      background: var(--success-bg);
      border: 1px solid #bbf7d0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, .55);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, .25);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      margin: 0;
      font-size: 19px;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 20px;
    }

    .modal-body {
      padding: 20px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .detail {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
    }

    .detail-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 18px 20px;
      border-top: 1px solid var(--border);
    }

    .confirm-text {
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    @media (max-width: 800px) {

      .page {
        padding: 18px 12px;
      }

      .header {
        flex-direction: column;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

  <main class="page">


<div class="container">

  <header class="header">

    <div>

      <p class="eyebrow">
        Administração SaaS
      </p>

      <h1>
        Assinaturas
      </h1>

      <p class="subtitle">
        Gerencie as assinaturas das empresas cadastradas no sistema.
      </p>

    </div>

    <div class="header-actions">

      <button
        type="button"
        class="btn btn-secondary"
        id="btn-voltar"
      >
        Voltar
      </button>

      <button
        type="button"
        class="btn btn-primary"
        id="btn-atualizar"
      >
        Atualizar
      </button>

    </div>

  </header>


  <div
    id="alert-error"
    class="alert alert-error"
  ></div>

  <div
    id="alert-success"
    class="alert alert-success"
  ></div>


  <section class="card">

    <div class="filters">

      <input
        type="search"
        id="filtro-busca"
        class="field"
        placeholder="Pesquisar empresa, plano ou ID..."
      >

      <select
        id="filtro-status"
        class="field"
      >

        <option value="">
          Todos os status
        </option>

        <option value="ativa">
          Ativa
        </option>

        <option value="pendente">
          Pendente
        </option>

        <option value="pausada">
          Pausada
        </option>

        <option value="inadimplente">
          Inadimplente
        </option>

        <option value="cancelada">
          Cancelada
        </option>

      </select>

      <button
        type="button"
        class="btn btn-secondary"
        id="btn-limpar"
      >
        Limpar filtros
      </button>

    </div>


    <div
      id="loading"
      class="loading"
    >
      Carregando assinaturas...
    </div>


    <div
      id="empty"
      class="empty"
      style="display:none;"
    >
      Nenhuma assinatura encontrada.
    </div>


    <div
      id="table-container"
      class="table-wrapper"
      style="display:none;"
    >

      <table>

        <thead>

          <tr>

            <th>
              Empresa
            </th>

            <th>
              Plano
            </th>

            <th>
              Status
            </th>

            <th>
              Início
            </th>

            <th>
              Próxima cobrança
            </th>

            <th>
              Mercado Pago
            </th>

            <th>
              Ações
            </th>

          </tr>

        </thead>

        <tbody
          id="assinaturas-body"
        ></tbody>

      </table>

    </div>

  </section>

</div>


  </main>

  <div
    id="modal-detalhes"
    class="modal-backdrop"
  >


<div class="modal">

  <div class="modal-header">

    <h2
      class="modal-title"
      id="modal-detalhes-titulo"
    >
      Detalhes da assinatura
    </h2>

    <button
      type="button"
      class="modal-close"
      data-close="modal-detalhes"
    >
      ×
    </button>

  </div>

  <div
    class="modal-body"
    id="modal-detalhes-body"
  ></div>

  <div class="modal-footer">

    <button
      type="button"
      class="btn btn-secondary"
      data-close="modal-detalhes"
    >
      Fechar
    </button>

  </div>

</div>


  </div>

  <div
    id="modal-confirmacao"
    class="modal-backdrop"
  >


<div class="modal">

  <div class="modal-header">

    <h2
      class="modal-title"
      id="modal-confirmacao-titulo"
    >
      Confirmar ação
    </h2>

    <button
      type="button"
      class="modal-close"
      data-close="modal-confirmacao"
    >
      ×
    </button>

  </div>

  <div class="modal-body">

    <p
      id="modal-confirmacao-texto"
      class="confirm-text"
    ></p>

  </div>

  <div class="modal-footer">

    <button
      type="button"
      class="btn btn-secondary"
      data-close="modal-confirmacao"
    >
      Cancelar
    </button>

    <button
      type="button"
      class="btn btn-danger"
      id="btn-confirmar-acao"
    >
      Confirmar
    </button>

  </div>

</div>


  </div>

  <script>

    (() => {

      'use strict';


      const API = '/api';

      const AUTH_TOKEN_KEY =
        'lavajato_auth_token';


      const loading =
        document.getElementById('loading');

      const empty =
        document.getElementById('empty');

      const tableContainer =
        document.getElementById('table-container');

      const tbody =
        document.getElementById('assinaturas-body');

      const filtroBusca =
        document.getElementById('filtro-busca');

      const filtroStatus =
        document.getElementById('filtro-status');

      const alertError =
        document.getElementById('alert-error');

      const alertSuccess =
        document.getElementById('alert-success');


      let assinaturas = [];

      let acaoPendente = null;


      function escapeHtml(value) {

        return String(
          value ?? ''
        ).replace(
          /[&<>"']/g,
          character => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          })[character]
        );

      }


      function mostrarErro(message) {

        alertSuccess.classList.remove('show');

        alertError.textContent =
          message ||
          'Ocorreu um erro.';

        alertError.classList.add('show');

      }


      function mostrarSucesso(message) {

        alertError.classList.remove('show');

        alertSuccess.textContent =
          message ||
          'Operação realizada com sucesso.';

        alertSuccess.classList.add('show');

      }


      function limparAlertas() {

        alertError.classList.remove('show');

        alertSuccess.classList.remove('show');

        alertError.textContent = '';

        alertSuccess.textContent = '';

      }


      function formatarMoeda(value) {

        return Number(value || 0)
          .toLocaleString(
            'pt-BR',
            {
              style: 'currency',
              currency: 'BRL'
            }
          );

      }


      function formatarData(value) {

        if (!value) {
          return '-';
        }

        const data =
          new Date(value);

        if (
          Number.isNaN(
            data.getTime()
          )
        ) {
          return '-';
        }

        return data.toLocaleDateString(
          'pt-BR'
        );

      }


      function formatarStatus(status) {

        const nomes = {

          ativa: 'Ativa',

          pendente: 'Pendente',

          pausada: 'Pausada',

          inadimplente:
            'Inadimplente',

          cancelada:
            'Cancelada'

        };

        return nomes[status] ||
          status ||
          'Desconhecido';

      }


      function classeStatus(status) {

        if (
          [
            'ativa',
            'pendente',
            'pausada',
            'inadimplente',
            'cancelada'
          ].includes(status)
        ) {

          return `status-${status}`;

        }

        return 'status-default';

      }


      async function api(
        path,
        options = {}
      ) {

        const token =
          localStorage.getItem(
            AUTH_TOKEN_KEY
          );


        const headers = {
          ...(options.body
            ? {
                'Content-Type':
                  'application/json'
              }
            : {}),
          ...(options.headers || {})
        };


        if (token) {

          headers.Authorization =
            `Bearer ${token}`;

        }


        const response =
          await fetch(
            API + path,
            {
              ...options,
              headers
            }
          );


        let data = null;


        try {

          data =
            await response.json();

        } catch (_) {

          data = null;

        }


        if (
          response.status === 401
        ) {

          localStorage.removeItem(
            AUTH_TOKEN_KEY
          );

          window.location.href = '/';

          throw new Error(
            'Sessão expirada.'
          );

        }


        if (
          response.status === 403
        ) {

          throw new Error(
            data?.erro ||
            'Acesso não autorizado.'
          );

        }


        if (!response.ok) {

          throw new Error(
            data?.erro ||
            data?.message ||
            'Erro na requisição.'
          );

        }


        return data;

      }


      async function verificarDev() {

        const token =
          localStorage.getItem(
            AUTH_TOKEN_KEY
          );


        if (!token) {

          window.location.href = '/';

          return false;

        }


        const data =
          await api(
            '/auth/me'
          );


        if (
          data?.usuario?.perfil !==
          'dev'
        ) {

          window.location.href =
            '/';

          return false;

        }


        return true;

      }


      async function carregarAssinaturas() {

        limparAlertas();

        loading.style.display =
          'block';

        empty.style.display =
          'none';

        tableContainer.style.display =
          'none';


        try {

          const data =
            await api(
              '/admin/assinaturas'
            );


          assinaturas =
            Array.isArray(data)
              ? data
              : (
                  Array.isArray(
                    data?.assinaturas
                  )
                    ? data.assinaturas
                    : []
                );


          renderizar();

        } catch (error) {

          console.error(
            'Erro ao carregar assinaturas:',
            error
          );

          loading.style.display =
            'none';

          mostrarErro(
            error.message ||
            'Não foi possível carregar as assinaturas.'
          );

        }

      }


      function obterAssinaturasFiltradas() {

        const busca =
          filtroBusca.value
            .trim()
            .toLowerCase();

        const status =
          filtroStatus.value;


        return assinaturas.filter(
          assinatura => {

            const texto = [

              assinatura.empresa_nome,

              assinatura.plano_nome,

              assinatura.id,

              assinatura.empresa_id,

              assinatura.mercado_pago_id

            ]
              .join(' ')
              .toLowerCase();


            const correspondeBusca =
              !busca ||
              texto.includes(busca);


            const correspondeStatus =
              !status ||
              assinatura.status ===
                status;


            return (
              correspondeBusca &&
              correspondeStatus
            );

          }
        );

      }


      function renderizar() {

        loading.style.display =
          'none';


        const lista =
          obterAssinaturasFiltradas();


        tbody.innerHTML = '';


        if (
          lista.length === 0
        ) {

          tableContainer.style.display =
            'none';

          empty.style.display =
            'block';

          return;

        }


        empty.style.display =
          'none';

        tableContainer.style.display =
          'block';


        lista.forEach(
          assinatura => {

            const tr =
              document.createElement(
                'tr'
              );


            const empresaNome =
              assinatura.empresa_nome ||
              `Empresa #${assinatura.empresa_id}`;


            const planoNome =
              assinatura.plano_nome ||
              `Plano #${assinatura.plano_id}`;


            const mercadoPagoId =
              assinatura.mercado_pago_id ||
              '-';


            tr.innerHTML = `

              <td>

                <div class="company-name">
                  ${escapeHtml(empresaNome)}
                </div>

                <div class="company-id">
                  ID: ${escapeHtml(assinatura.empresa_id)}
                </div>

              </td>


              <td>

                <div class="plan-name">
                  ${escapeHtml(planoNome)}
                </div>

                <div class="plan-price">
                  ${
                    assinatura.plano_valor !== null &&
                    assinatura.plano_valor !== undefined
                      ? formatarMoeda(
                          assinatura.plano_valor
                        )
                      : '-'
                  }
                </div>

              </td>


              <td>

                <span
                  class="status ${classeStatus(
                    assinatura.status
                  )}"
                >
                  ${escapeHtml(
                    formatarStatus(
                      assinatura.status
                    )
                  )}
                </span>

              </td>


              <td>
                ${escapeHtml(
                  formatarData(
                    assinatura.inicio_em
                  )
                )}
              </td>


              <td>
                ${escapeHtml(
                  formatarData(
                    assinatura.proxima_cobranca_em
                  )
                )}
              </td>


              <td>

                <div class="mp-id">
                  ${escapeHtml(
                    mercadoPagoId
                  )}
                </div>

              </td>


              <td>

                <div class="actions-cell">

                  <button
                    type="button"
                    class="action-btn"
                    data-action="detalhes"
                    data-id="${assinatura.id}"
                  >
                    Detalhes
                  </button>

                  ${
                    assinatura.status === 'ativa'
                      ? `
                        <button
                          type="button"
                          class="action-btn"
                          data-action="pausar"
                          data-id="${assinatura.id}"
                        >
                          Pausar
                        </button>

                        <button
                          type="button"
                          class="action-btn"
                          data-action="cancelar"
                          data-id="${assinatura.id}"
                        >
                          Cancelar
                        </button>
                      `
                      : ''
                  }

                  ${
                    assinatura.status === 'pausada'
                      ? `
                        <button
                          type="button"
                          class="action-btn"
                          data-action="reativar"
                          data-id="${assinatura.id}"
                        >
                          Reativar
                        </button>
                      `
                      : ''
                  }

                  ${
                    assinatura.status === 'inadimplente'
                      ? `
                        <button
                          type="button"
                          class="action-btn"
                          data-action="reativar"
                          data-id="${assinatura.id}"
                        >
                          Reativar
                        </button>
                      `
                      : ''
                  }

                </div>

              </td>

            `;


            tbody.appendChild(
              tr
            );

          }
        );

      }


      function encontrarAssinatura(id) {

        return assinaturas.find(
          assinatura =>
            String(
              assinatura.id
            ) === String(id)
        );

      }


      function abrirModal(
        id
      ) {

        const assinatura =
          encontrarAssinatura(id);


        if (!assinatura) {

          mostrarErro(
            'Assinatura não encontrada.'
          );

          return;

        }


        const body =
          document.getElementById(
            'modal-detalhes-body'
          );


        body.innerHTML = `

          <div class="detail-grid">

            <div class="detail">

              <div class="detail-label">
                ID da assinatura
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.id
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Status
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarStatus(
                    assinatura.status
                  )
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Empresa
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.empresa_nome ||
                  `Empresa #${assinatura.empresa_id}`
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Empresa ID
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.empresa_id
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Plano
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.plano_nome ||
                  `Plano #${assinatura.plano_id}`
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Valor
              </div>

              <div class="detail-value">
                ${
                  assinatura.plano_valor !== null &&
                  assinatura.plano_valor !== undefined
                    ? formatarMoeda(
                        assinatura.plano_valor
                      )
                    : '-'
                }
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Período
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.plano_periodo ||
                  '-'
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Mercado Pago ID
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.mercado_pago_id ||
                  '-'
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Início
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarData(
                    assinatura.inicio_em
                  )
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Próxima cobrança
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarData(
                    assinatura.proxima_cobranca_em
                  )
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Cancelada em
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarData(
                    assinatura.cancelada_em
                  )
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Criada em
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarData(
                    assinatura.criado_em
                  )
                )}
              </div>

            </div>

          </div>

        `;


        document
          .getElementById(
            'modal-detalhes'
          )
          .classList.add('show');

      }


      function prepararAcao(
        id,
        acao
      ) {

        const assinatura =
          encontrarAssinatura(id);


        if (!assinatura) {

          mostrarErro(
            'Assinatura não encontrada.'
          );

          return;

        }


        const nomes = {

          pausar:
            'pausar',

          reativar:
            'reativar',

          cancelar:
            'cancelar'

        };


        const verbo =
          nomes[acao] ||
          acao;


        const empresa =
          assinatura.empresa_nome ||
          `Empresa #${assinatura.empresa_id}`;


        const texto =
          `Deseja ${verbo} a assinatura da empresa "${empresa}"?`;


        document
          .getElementById(
            'modal-confirmacao-texto'
          )
          .textContent =
            texto;


        acaoPendente = {
          id,
          acao
        };


        document
          .getElementById(
            'modal-confirmacao'
          )
          .classList.add('show');

      }


      async function executarAcao() {

        if (!acaoPendente) {
          return;
        }


        const {
          id,
          acao
        } =
          acaoPendente;


        const botao =
          document.getElementById(
            'btn-confirmar-acao'
          );


        botao.disabled =
          true;

        botao.textContent =
          'Processando...';


        try {

          await api(
            `/admin/assinaturas/${id}/${acao}`,
            {
              method: 'PATCH'
            }
          );


          fecharModal(
            'modal-confirmacao'
          );


          mostrarSucesso(
            'Assinatura atualizada com sucesso.'
          );


          acaoPendente =
            null;


          await carregarAssinaturas();

        } catch (error) {

          console.error(
            'Erro ao executar ação:',
            error
          );

          mostrarErro(
            error.message ||
            'Não foi possível atualizar a assinatura.'
          );

        } finally {

          botao.disabled =
            false;

          botao.textContent =
            'Confirmar';

        }

      }


      function fecharModal(id) {

        const modal =
          document.getElementById(id);

        if (modal) {

          modal.classList.remove(
            'show'
          );

        }

      }


      tbody.addEventListener(
        'click',
        event => {

          const button =
            event.target.closest(
              '[data-action]'
            );


          if (!button) {
            return;
          }


          const action =
            button.dataset.action;

          const id =
            button.dataset.id;


          if (
            action === 'detalhes'
          ) {

            abrirModal(id);

            return;

          }


          if (
            [
              'pausar',
              'reativar',
              'cancelar'
            ].includes(action)
          ) {

            prepararAcao(
              id,
              action
            );

          }

        }
      );


      filtroBusca.addEventListener(
        'input',
        renderizar
      );


      filtroStatus.addEventListener(
        'change',
        renderizar
      );


      document
        .getElementById('btn-limpar')
        .addEventListener(
          'click',
          () => {

            filtroBusca.value =
              '';

            filtroStatus.value =
              '';

            renderizar();

          }
        );


      document
        .getElementById('btn-atualizar')
        .addEventListener(
          'click',
          carregarAssinaturas
        );


      document
        .getElementById('btn-voltar')
        .addEventListener(
          'click',
          () => {

            window.location.href =
              '/admin/dashboard.html';

          }
        );


      document
        .getElementById(
          'btn-confirmar-acao'
        )
        .addEventListener(
          'click',
          executarAcao
        );


      document
        .querySelectorAll(
          '[data-close]'
        )
        .forEach(
          button => {

            button.addEventListener(
              'click',
              () => {

                fecharModal(
                  button.dataset.close
                );

              }
            );

          }
        );


      document
        .querySelectorAll(
          '.modal-backdrop'
        )
        .forEach(
          modal => {

            modal.addEventListener(
              'click',
              event => {

                if (
                  event.target ===
                  modal
                ) {

                  modal.classList.remove(
                    'show'
                  );

                }

              }
            );

          }
        );


      async function iniciar() {

        try {

          const autorizado =
            await verificarDev();


          if (!autorizado) {
            return;
          }


          await carregarAssinaturas();

        } catch (error) {

          console.error(
            'Erro ao iniciar página:',
            error
          );

          loading.style.display =
            'none';

          mostrarErro(
            error.message ||
            'Não foi possível carregar a página.'
          );

        }

      }


      iniciar();

    })();

  </script>

</body>

</html>
