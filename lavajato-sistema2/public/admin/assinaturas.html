<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Assinaturas | Orvix</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

  <link
    rel="stylesheet"
    href="/css/dev.css"
  >

</head>

<body>

  <main class="page">


<div class="container">

  <header class="header">

    <div>

      <p class="eyebrow">
        Administração SaaS
      </p>

      <h1>
        Assinaturas
      </h1>

      <p class="subtitle">
        Gerencie as assinaturas das empresas cadastradas no sistema.
      </p>

    </div>

    <div class="header-actions">

      <button
        type="button"
        class="btn btn-secondary"
        id="btn-voltar"
      >
        Voltar
      </button>

      <button
        type="button"
        class="btn btn-primary"
        id="btn-atualizar"
      >
        Atualizar
      </button>

    </div>

  </header>


  <div
    id="alert-error"
    class="alert alert-error"
  ></div>

  <div
    id="alert-success"
    class="alert alert-success"
  ></div>


  <section class="card">

    <div class="filters">

      <input
        type="search"
        id="filtro-busca"
        class="field"
        placeholder="Pesquisar empresa, plano ou ID..."
      >

      <select
        id="filtro-status"
        class="field"
      >

        <option value="">
          Todos os status
        </option>

        <option value="ativa">
          Ativa
        </option>

        <option value="pendente">
          Pendente
        </option>

        <option value="pausada">
          Pausada
        </option>

        <option value="inadimplente">
          Inadimplente
        </option>

        <option value="cancelada">
          Cancelada
        </option>

      </select>

      <button
        type="button"
        class="btn btn-secondary"
        id="btn-limpar"
      >
        Limpar filtros
      </button>

    </div>


    <div
      id="loading"
      class="loading"
    >
      Carregando assinaturas...
    </div>


    <div
      id="empty"
      class="empty"
      style="display:none;"
    >
      Nenhuma assinatura encontrada.
    </div>


    <div
      id="table-container"
      class="table-wrapper"
      style="display:none;"
    >

      <table>

        <thead>

          <tr>

            <th>
              Empresa
            </th>

            <th>
              Plano
            </th>

            <th>
              Status
            </th>

            <th>
              Início
            </th>

            <th>
              Próxima cobrança
            </th>

            <th>
              Mercado Pago
            </th>

            <th>
              Ações
            </th>

          </tr>

        </thead>

        <tbody
          id="assinaturas-body"
        ></tbody>

      </table>

    </div>

  </section>

</div>


  </main>

  <div
    id="modal-detalhes"
    class="modal-backdrop"
  >


<div class="modal">

  <div class="modal-header">

    <h2
      class="modal-title"
      id="modal-detalhes-titulo"
    >
      Detalhes da assinatura
    </h2>

    <button
      type="button"
      class="modal-close"
      data-close="modal-detalhes"
    >
      ×
    </button>

  </div>

  <div
    class="modal-body"
    id="modal-detalhes-body"
  ></div>

  <div class="modal-footer">

    <button
      type="button"
      class="btn btn-secondary"
      data-close="modal-detalhes"
    >
      Fechar
    </button>

  </div>

</div>


  </div>

  <div
    id="modal-confirmacao"
    class="modal-backdrop"
  >


<div class="modal">

  <div class="modal-header">

    <h2
      class="modal-title"
      id="modal-confirmacao-titulo"
    >
      Confirmar ação
    </h2>

    <button
      type="button"
      class="modal-close"
      data-close="modal-confirmacao"
    >
      ×
    </button>

  </div>

  <div class="modal-body">

    <p
      id="modal-confirmacao-texto"
      class="confirm-text"
    ></p>

  </div>

  <div class="modal-footer">

    <button
      type="button"
      class="btn btn-secondary"
      data-close="modal-confirmacao"
    >
      Cancelar
    </button>

    <button
      type="button"
      class="btn btn-danger"
      id="btn-confirmar-acao"
    >
      Confirmar
    </button>

  </div>

</div>


  </div>

  <script>

    (() => {

      'use strict';


      const API = '/api';

      const AUTH_TOKEN_KEY =
        'lavajato_auth_token';


      const loading =
        document.getElementById('loading');

      const empty =
        document.getElementById('empty');

      const tableContainer =
        document.getElementById('table-container');

      const tbody =
        document.getElementById('assinaturas-body');

      const filtroBusca =
        document.getElementById('filtro-busca');

      const filtroStatus =
        document.getElementById('filtro-status');

      const alertError =
        document.getElementById('alert-error');

      const alertSuccess =
        document.getElementById('alert-success');


      let assinaturas = [];

      let acaoPendente = null;


      function escapeHtml(value) {

        return String(
          value ?? ''
        ).replace(
          /[&<>"']/g,
          character => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          })[character]
        );

      }


      function mostrarErro(message) {

        alertSuccess.classList.remove('show');

        alertError.textContent =
          message ||
          'Ocorreu um erro.';

        alertError.classList.add('show');

      }


      function mostrarSucesso(message) {

        alertError.classList.remove('show');

        alertSuccess.textContent =
          message ||
          'Operação realizada com sucesso.';

        alertSuccess.classList.add('show');

      }


      function limparAlertas() {

        alertError.classList.remove('show');

        alertSuccess.classList.remove('show');

        alertError.textContent = '';

        alertSuccess.textContent = '';

      }


      function formatarMoeda(value) {

        return Number(value || 0)
          .toLocaleString(
            'pt-BR',
            {
              style: 'currency',
              currency: 'BRL'
            }
          );

      }


      function formatarData(value) {

        if (!value) {
          return '-';
        }

        const data =
          new Date(value);

        if (
          Number.isNaN(
            data.getTime()
          )
        ) {
          return '-';
        }

        return data.toLocaleDateString(
          'pt-BR'
        );

      }


      function formatarStatus(status) {

        const nomes = {

          ativa: 'Ativa',

          pendente: 'Pendente',

          pausada: 'Pausada',

          inadimplente:
            'Inadimplente',

          cancelada:
            'Cancelada'

        };

        return nomes[status] ||
          status ||
          'Desconhecido';

      }


      function classeStatus(status) {

        if (
          [
            'ativa',
            'pendente',
            'pausada',
            'inadimplente',
            'cancelada'
          ].includes(status)
        ) {

          return `status-${status}`;

        }

        return 'status-default';

      }


      async function api(
        path,
        options = {}
      ) {

        const token =
          localStorage.getItem(
            AUTH_TOKEN_KEY
          );


        const headers = {
          ...(options.body
            ? {
                'Content-Type':
                  'application/json'
              }
            : {}),
          ...(options.headers || {})
        };


        if (token) {

          headers.Authorization =
            `Bearer ${token}`;

        }


        const response =
          await fetch(
            API + path,
            {
              ...options,
              headers
            }
          );


        let data = null;


        try {

          data =
            await response.json();

        } catch (_) {

          data = null;

        }


        if (
          response.status === 401
        ) {

          localStorage.removeItem(
            AUTH_TOKEN_KEY
          );

          window.location.href = '/';

          throw new Error(
            'Sessão expirada.'
          );

        }


        if (
          response.status === 403
        ) {

          throw new Error(
            data?.erro ||
            'Acesso não autorizado.'
          );

        }


        if (!response.ok) {

          throw new Error(
            data?.erro ||
            data?.message ||
            'Erro na requisição.'
          );

        }


        return data;

      }


      async function verificarDev() {

        const token =
          localStorage.getItem(
            AUTH_TOKEN_KEY
          );


        if (!token) {

          window.location.href = '/';

          return false;

        }


        const data =
          await api(
            '/auth/me'
          );


        if (
          data?.usuario?.perfil !==
          'dev'
        ) {

          window.location.href =
            '/';

          return false;

        }


        return true;

      }


      async function carregarAssinaturas() {

        limparAlertas();

        loading.style.display =
          'block';

        empty.style.display =
          'none';

        tableContainer.style.display =
          'none';


        try {

          const data =
            await api(
              '/admin/assinaturas'
            );


          assinaturas =
            Array.isArray(data)
              ? data
              : (
                  Array.isArray(
                    data?.assinaturas
                  )
                    ? data.assinaturas
                    : []
                );


          renderizar();

        } catch (error) {

          console.error(
            'Erro ao carregar assinaturas:',
            error
          );

          loading.style.display =
            'none';

          mostrarErro(
            error.message ||
            'Não foi possível carregar as assinaturas.'
          );

        }

      }


      function obterAssinaturasFiltradas() {

        const busca =
          filtroBusca.value
            .trim()
            .toLowerCase();

        const status =
          filtroStatus.value;


        return assinaturas.filter(
          assinatura => {

            const texto = [

              assinatura.empresa_nome,

              assinatura.plano_nome,

              assinatura.id,

              assinatura.empresa_id,

              assinatura.mercado_pago_id

            ]
              .join(' ')
              .toLowerCase();


            const correspondeBusca =
              !busca ||
              texto.includes(busca);


            const correspondeStatus =
              !status ||
              assinatura.status ===
                status;


            return (
              correspondeBusca &&
              correspondeStatus
            );

          }
        );

      }


      function renderizar() {

        loading.style.display =
          'none';


        const lista =
          obterAssinaturasFiltradas();


        tbody.innerHTML = '';


        if (
          lista.length === 0
        ) {

          tableContainer.style.display =
            'none';

          empty.style.display =
            'block';

          return;

        }


        empty.style.display =
          'none';

        tableContainer.style.display =
          'block';


        lista.forEach(
          assinatura => {

            const tr =
              document.createElement(
                'tr'
              );


            const empresaNome =
              assinatura.empresa_nome ||
              `Empresa #${assinatura.empresa_id}`;


            const planoNome =
              assinatura.plano_nome ||
              `Plano #${assinatura.plano_id}`;


            const mercadoPagoId =
              assinatura.mercado_pago_id ||
              '-';


            tr.innerHTML = `

              <td>

                <div class="company-name">
                  ${escapeHtml(empresaNome)}
                </div>

                <div class="company-id">
                  ID: ${escapeHtml(assinatura.empresa_id)}
                </div>

              </td>


              <td>

                <div class="plan-name">
                  ${escapeHtml(planoNome)}
                </div>

                <div class="plan-price">
                  ${
                    assinatura.plano_valor !== null &&
                    assinatura.plano_valor !== undefined
                      ? formatarMoeda(
                          assinatura.plano_valor
                        )
                      : '-'
                  }
                </div>

              </td>


              <td>

                <span
                  class="status ${classeStatus(
                    assinatura.status
                  )}"
                >
                  ${escapeHtml(
                    formatarStatus(
                      assinatura.status
                    )
                  )}
                </span>

              </td>


              <td>
                ${escapeHtml(
                  formatarData(
                    assinatura.inicio_em
                  )
                )}
              </td>


              <td>
                ${escapeHtml(
                  formatarData(
                    assinatura.proxima_cobranca_em
                  )
                )}
              </td>


              <td>

                <div class="mp-id">
                  ${escapeHtml(
                    mercadoPagoId
                  )}
                </div>

              </td>


              <td>

                <div class="actions-cell">

                  <button
                    type="button"
                    class="action-btn"
                    data-action="detalhes"
                    data-id="${assinatura.id}"
                  >
                    Detalhes
                  </button>

                  ${
                    assinatura.status === 'ativa'
                      ? `
                        <button
                          type="button"
                          class="action-btn"
                          data-action="pausar"
                          data-id="${assinatura.id}"
                        >
                          Pausar
                        </button>

                        <button
                          type="button"
                          class="action-btn"
                          data-action="cancelar"
                          data-id="${assinatura.id}"
                        >
                          Cancelar
                        </button>
                      `
                      : ''
                  }

                  ${
                    assinatura.status === 'pausada'
                      ? `
                        <button
                          type="button"
                          class="action-btn"
                          data-action="reativar"
                          data-id="${assinatura.id}"
                        >
                          Reativar
                        </button>
                      `
                      : ''
                  }

                  ${
                    assinatura.status === 'inadimplente'
                      ? `
                        <button
                          type="button"
                          class="action-btn"
                          data-action="reativar"
                          data-id="${assinatura.id}"
                        >
                          Reativar
                        </button>
                      `
                      : ''
                  }

                </div>

              </td>

            `;


            tbody.appendChild(
              tr
            );

          }
        );

      }


      function encontrarAssinatura(id) {

        return assinaturas.find(
          assinatura =>
            String(
              assinatura.id
            ) === String(id)
        );

      }


      function abrirModal(
        id
      ) {

        const assinatura =
          encontrarAssinatura(id);


        if (!assinatura) {

          mostrarErro(
            'Assinatura não encontrada.'
          );

          return;

        }


        const body =
          document.getElementById(
            'modal-detalhes-body'
          );


        body.innerHTML = `

          <div class="detail-grid">

            <div class="detail">

              <div class="detail-label">
                ID da assinatura
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.id
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Status
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarStatus(
                    assinatura.status
                  )
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Empresa
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.empresa_nome ||
                  `Empresa #${assinatura.empresa_id}`
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Empresa ID
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.empresa_id
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Plano
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.plano_nome ||
                  `Plano #${assinatura.plano_id}`
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Valor
              </div>

              <div class="detail-value">
                ${
                  assinatura.plano_valor !== null &&
                  assinatura.plano_valor !== undefined
                    ? formatarMoeda(
                        assinatura.plano_valor
                      )
                    : '-'
                }
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Período
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.plano_periodo ||
                  '-'
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Mercado Pago ID
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  assinatura.mercado_pago_id ||
                  '-'
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Início
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarData(
                    assinatura.inicio_em
                  )
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Próxima cobrança
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarData(
                    assinatura.proxima_cobranca_em
                  )
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Cancelada em
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarData(
                    assinatura.cancelada_em
                  )
                )}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Criada em
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  formatarData(
                    assinatura.criado_em
                  )
                )}
              </div>

            </div>

          </div>

        `;


        document
          .getElementById(
            'modal-detalhes'
          )
          .classList.add('show');

      }


      function prepararAcao(
        id,
        acao
      ) {

        const assinatura =
          encontrarAssinatura(id);


        if (!assinatura) {

          mostrarErro(
            'Assinatura não encontrada.'
          );

          return;

        }


        const nomes = {

          pausar:
            'pausar',

          reativar:
            'reativar',

          cancelar:
            'cancelar'

        };


        const verbo =
          nomes[acao] ||
          acao;


        const empresa =
          assinatura.empresa_nome ||
          `Empresa #${assinatura.empresa_id}`;


        const texto =
          `Deseja ${verbo} a assinatura da empresa "${empresa}"?`;


        document
          .getElementById(
            'modal-confirmacao-texto'
          )
          .textContent =
            texto;


        acaoPendente = {
          id,
          acao
        };


        document
          .getElementById(
            'modal-confirmacao'
          )
          .classList.add('show');

      }


      async function executarAcao() {

        if (!acaoPendente) {
          return;
        }


        const {
          id,
          acao
        } =
          acaoPendente;


        const botao =
          document.getElementById(
            'btn-confirmar-acao'
          );


        botao.disabled =
          true;

        botao.textContent =
          'Processando...';


        try {

          await api(
            `/admin/assinaturas/${id}/${acao}`,
            {
              method: 'PATCH'
            }
          );


          fecharModal(
            'modal-confirmacao'
          );


          mostrarSucesso(
            'Assinatura atualizada com sucesso.'
          );


          acaoPendente =
            null;


          await carregarAssinaturas();

        } catch (error) {

          console.error(
            'Erro ao executar ação:',
            error
          );

          mostrarErro(
            error.message ||
            'Não foi possível atualizar a assinatura.'
          );

        } finally {

          botao.disabled =
            false;

          botao.textContent =
            'Confirmar';

        }

      }


      function fecharModal(id) {

        const modal =
          document.getElementById(id);

        if (modal) {

          modal.classList.remove(
            'show'
          );

        }

      }


      tbody.addEventListener(
        'click',
        event => {

          const button =
            event.target.closest(
              '[data-action]'
            );


          if (!button) {
            return;
          }


          const action =
            button.dataset.action;

          const id =
            button.dataset.id;


          if (
            action === 'detalhes'
          ) {

            abrirModal(id);

            return;

          }


          if (
            [
              'pausar',
              'reativar',
              'cancelar'
            ].includes(action)
          ) {

            prepararAcao(
              id,
              action
            );

          }

        }
      );


      filtroBusca.addEventListener(
        'input',
        renderizar
      );


      filtroStatus.addEventListener(
        'change',
        renderizar
      );


      document
        .getElementById('btn-limpar')
        .addEventListener(
          'click',
          () => {

            filtroBusca.value =
              '';

            filtroStatus.value =
              '';

            renderizar();

          }
        );


      document
        .getElementById('btn-atualizar')
        .addEventListener(
          'click',
          carregarAssinaturas
        );


      document
        .getElementById('btn-voltar')
        .addEventListener(
          'click',
          () => {

            window.location.href =
              '/admin/dashboard.html';

          }
        );


      document
        .getElementById(
          'btn-confirmar-acao'
        )
        .addEventListener(
          'click',
          executarAcao
        );


      document
        .querySelectorAll(
          '[data-close]'
        )
        .forEach(
          button => {

            button.addEventListener(
              'click',
              () => {

                fecharModal(
                  button.dataset.close
                );

              }
            );

          }
        );


      document
        .querySelectorAll(
          '.modal-backdrop'
        )
        .forEach(
          modal => {

            modal.addEventListener(
              'click',
              event => {

                if (
                  event.target ===
                  modal
                ) {

                  modal.classList.remove(
                    'show'
                  );

                }

              }
            );

          }
        );


      async function iniciar() {

        try {

          const autorizado =
            await verificarDev();


          if (!autorizado) {
            return;
          }


          await carregarAssinaturas();

        } catch (error) {

          console.error(
            'Erro ao iniciar página:',
            error
          );

          loading.style.display =
            'none';

          mostrarErro(
            error.message ||
            'Não foi possível carregar a página.'
          );

        }

      }


      iniciar();

    })();

  </script>

  <script src="/js/dev-sidebar.js"></script>

</body>

</html>
