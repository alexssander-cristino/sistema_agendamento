<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>429 — Muitas requisições</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .code {
      font-size: clamp(90px, 20vw, 160px);
      line-height: .9;
      font-weight: 800;
      letter-spacing: -8px;
      color: #111827;
    }

    h1 {
      margin-top: 28px;
      font-size: 28px;
      font-weight: 700;
    }

    p {
      margin: 14px auto 0;
      max-width: 430px;
      line-height: 1.6;
      color: #6b7280;
      font-size: 16px;
    }

    .box {
      margin-top: 28px;
      padding: 18px 20px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
    }

    .box strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #374151;
    }

    #timer {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
    }

    .back {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: .2s;
    }

    .back:hover {
      opacity: .9;
      transform: translateY(-1px);
    }
  </style>

</head>

<body>

  <main class="container">

```
<div class="code">429</div>

<h1>Muitas requisições</h1>

<p>
  Foram realizadas muitas tentativas em sequência.
  Por segurança, o acesso foi temporariamente limitado.
</p>

<div class="box">
  <strong>Tente novamente em</strong>
  <span id="timer">15:00</span>
</div>

<a href="/login" class="back">
  Voltar para o login
</a>
```

  </main>

  <script>
    let remaining = 15 * 60;

    const timer = document.getElementById('timer');

    function updateTimer() {
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;

      timer.textContent =
        String(minutes).padStart(2, '0') +
        ':' +
        String(seconds).padStart(2, '0');

      if (remaining <= 0) {
        location.href = '/login';
        return;
      }

      remaining--;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
