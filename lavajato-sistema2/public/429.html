<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">

  <title>Muitas tentativas — Orvix</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f2f5f8;
      color: #111827;
    }

    .card {
      width: min(440px, 100%);
      padding: 36px 32px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, .12);
    }

    .icone {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 30px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 800;
    }

    p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .contador {
      margin: 24px 0 8px;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      color: #0e3a4c;
    }

    .legenda {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="icone">!</div>

    <h1>Muitas tentativas</h1>

    <p>
      Por segurança, o acesso foi bloqueado temporariamente.
      Você poderá tentar novamente quando o tempo abaixo terminar.
    </p>

    <div class="contador" id="contador">--:--</div>

    <div class="legenda">Tempo restante para liberar o acesso</div>

  </main>

  <script>

    (function () {

      var CHAVE = 'orvix_bloqueio_ate';

      function lerBloqueio() {
        try {
          var ate = Number(localStorage.getItem(CHAVE) || 0);
          return ate > Date.now() ? ate : 0;
        } catch (e) {
          return 0;
        }
      }

      function liberar() {
        try { localStorage.removeItem(CHAVE); } catch (e) {}
        window.location.replace('/');
      }

      var ate = lerBloqueio();

      // Sem bloqueio ativo: não há motivo para ficar nesta página
      if (!ate) {
        liberar();
        return;
      }

      // Impede de voltar para o login usando o botão "voltar"
      history.pushState(null, '', window.location.href);

      window.addEventListener('popstate', function () {
        history.pushState(null, '', window.location.href);
      });

      var contador = document.getElementById('contador');

      function formatar(ms) {

        var total = Math.max(0, Math.ceil(ms / 1000));

        var min = Math.floor(total / 60);
        var seg = total % 60;

        return (min < 10 ? '0' : '') + min + ':' + (seg < 10 ? '0' : '') + seg;
      }

      function atualizar() {

        var restante = ate - Date.now();

        if (restante <= 0) {
          liberar();
          return;
        }

        contador.textContent = formatar(restante);
      }

      atualizar();

      setInterval(atualizar, 1000);

    })();

  </script>

</body>
</html>
