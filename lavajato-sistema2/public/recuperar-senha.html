<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Recupere o acesso à sua conta Orvix."
  >

  <title>Esqueci minha senha | Orvix</title>

  <link
    rel="stylesheet"
    href="/css/recuperar-senha.css"
  >

</head>


<body>

  <main class="container">

    <section class="card">


      <!-- LOGO -->

      <div class="logo">

        <span>
          Orvix
        </span>

      </div>


      <!-- FORMULÁRIO -->

      <div id="formulario-container">

        <div class="header">

          <h1>
            Recuperar senha
          </h1>

          <p>
            Informe o e-mail da sua conta
            e enviaremos um link para
            redefinir sua senha.
          </p>

        </div>


        <!-- MENSAGEM -->

        <div
          id="mensagem"
          class="mensagem"
          role="alert"
          aria-live="polite"
        ></div>


        <!-- FORMULÁRIO -->

        <form
          id="form-recuperar-senha"
        >

          <div class="campo">

            <label for="email">
              E-mail da conta
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            >

          </div>


          <button
            type="submit"
            class="btn"
            id="btn-recuperar"
          >
            Enviar link de recuperação
          </button>

        </form>


        <a
          href="/"
          class="voltar"
        >
          Voltar para o login
        </a>

      </div>


      <!-- SUCESSO -->

      <div
        id="sucesso-container"
        class="sucesso-container"
        style="display:none;"
      >

        <div
          class="sucesso-icone"
          aria-hidden="true"
        >
          ✓
        </div>


        <h2>
          E-mail enviado
        </h2>


        <p>
          Se existir uma conta com esse e-mail,
          você receberá uma mensagem com as
          instruções para redefinir sua senha.
        </p>


        <a
          href="/"
          class="btn-login"
        >
          Voltar para o login
        </a>

      </div>


    </section>

  </main>


  <script
    src="/js/recuperarSenha.js"
  ></script>

</body>

</html>
