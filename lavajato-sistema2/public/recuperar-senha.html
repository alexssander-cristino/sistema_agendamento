<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Recupere o acesso à sua conta Orvix."
  >

  <title>Recuperar senha | Orvix</title>

    <link
        rel="stylesheet"
        href="/css/recuperar-senha.css"
        >
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="logo">
        <span>Orvix</span>
      </div>

      <!-- FORMULÁRIO -->
      <div id="formulario-container">

        <div class="header">
          <h1>Redefinir senha</h1>

          <p>
            Informe uma nova senha para recuperar
            o acesso à sua conta.
          </p>
        </div>

        <div
          id="mensagem"
          class="mensagem"
        ></div>

        <form id="formulario-recuperacao">

          <div class="campo">

            <label for="senha">
              Nova senha
            </label>

            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua nova senha"
              minlength="6"
              autocomplete="new-password"
              required
            >

            <div class="senha-info">
              A senha deve possuir pelo menos 6 caracteres.
            </div>

          </div>

          <div class="campo">

            <label for="confirmar-senha">
              Confirmar nova senha
            </label>

            <input
              type="password"
              id="confirmar-senha"
              name="confirmar-senha"
              placeholder="Digite a senha novamente"
              minlength="6"
              autocomplete="new-password"
              required
            >

          </div>

          <button
            type="submit"
            class="btn"
            id="btn-redefinir"
          >
            Redefinir senha
          </button>

        </form>

        <a
          href="/"
          class="voltar"
        >
          Voltar para o login
        </a>

      </div>

      <!-- SUCESSO -->
      <div
        id="sucesso-container"
        class="sucesso-container"
      >

        <div class="sucesso-icone">
          ✓
        </div>

        <h2>
          Senha redefinida
        </h2>

        <p>
          Sua senha foi alterada com sucesso.
          Agora você já pode entrar novamente
          na sua conta.
        </p>

        <a
          href="/"
          class="btn-login"
        >
          Ir para o login
        </a>

      </div>

    </section>

  </main>

    <script src="/js/recuperar-senha.js"></script>

</body>
</html>
